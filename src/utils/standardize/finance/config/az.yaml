      type: str

    - raw_name: "LastFiledDate"
      type: str

    - raw_name: "MasterCommitteeId"
      type: Int64
      # TODO: what is the difference between MasterCommitteeId and CommitteeID?

    - raw_name: "CommitteeTypeName"
      type: str
      standard_name: transactor_type_specific

    - raw_name: "RegistrationDate"
      type: str

    - raw_name: "CommitteeAddress"
      type: str

    - raw_name: "MailingAddress"
      type: str
      standard_name: address--full_address

    - raw_name: "Chairman"
      type: str
      standard_name: chairman--member--full_name

    - raw_name: "Treasurer"
      type: str
      standard_name: treasurer--member--full_name

    - raw_name: "Candidate"
      type: str
      standard_name: candidate--member--full_name

    - raw_name: "CandidatePhoneNo"
      type: str
      standard_name: candidate--member--phone_number

