advanced_search_transactions:
  inherits: base
  path_pattern: "^AdvancedSearch/(BallotMeasures|Contributions|Expenditures|IndependentExpenditures)-.*\\.csv$"
  table_name: Transaction

  column_details:
    - raw_name: "TransactionDate"
      type: str
      standard_name: date
      date_format: "/Date(%unix_ms)/"

    - raw_name: "CommitteeID"
      type: Int64
      standard_name: recipient_id

    - raw_name: "CommitteeName"
      type: str
      standard_name: recipient--full_name

    - raw_name: "CommitteeGroupNumber"
      type: Int32

    - raw_name: "Amount"
      type: Float32
      standard_name: amount

    - raw_name: "TransactionName"
      type: str
      standard_name: donor--full_name

    - raw_name: "TransactionType"
      type: str

    - raw_name: "TransactionNameID"
      type: Int64
      description: "Should presumable be the ID of the non-filing party. In experience always 0."

    - raw_name: "TransactionGroupNumber"
      type: Int32

    - raw_name: "TransactionTypeDispositionID"
      type: Int32

    - raw_name: "Occupation"
      type: str
      standard_name: donor--employer--role

    - raw_name: "Employer"
      type: str
      standard_name: donor--employer--organization--full_name

    - raw_name: "City"
      type: str
      standard_name: donor--address--city

    - raw_name: "State"
      type: str
      standard_name: donor--address--state

    - raw_name: "ZipCode"
      type: str
      standard_name: donor--address--zipcode

    - raw_name: "EntityDescription"
      type: str

    - raw_name: "Memo"
      type: str
      standard_name: description

    - raw_name: "TransactionTypeId"
      type: Int32
      standard_name: transaction_type

    - raw_name: "FirstName"
      type: str
      standard_name: donor--first_name

    - raw_name: "LastName"
      type: str
      standard_name: donor--last_name

    - raw_name: "FilerName"
      type: str

advanced_search_committees:
  inherits: base
  path_pattern: "^AdvancedSearch/Committee.*\\.csv$"
  table_name: Transactor
  column_details:
    - raw_name: "CommitteeName"
      type: str
      standard_name: full_name

    - raw_name: "PhoneNo"
      type: str
      standard_name: phone_number

    - raw_name: "Email"
      type: str
