# Docs: https://www.ethics.state.tx.us/data/search/cf/CampaignFinanceCSVFileFormat.pdf
base:
  meta: True
  state_code: TX
  read_csv_params:
    sep: ","
    encoding: utf-8
    on_bad_lines: skip
    header: 0
  state_code_columns:
    - reported_state

contributions:
  path_pattern: ^contribs_\d{2}\.csv$
  duplicate_columns:
    recipient--transactor_type:
      - recipient--transactor_type_specific
  enum_mapper:
    donor--transactor_type:
      INDIVIDUAL: Individual
      ENTITY: Organization


    recipient--transactor_type_specific:
      # https://www.ethics.state.tx.us/data/search/cf/TX_ERF13_7.pdf
      MPAC: Committee # Monthly Filing Gen Purp Comm
      COH: Individual # Candidate/Office Holder
      PTYCORP: Party # Political Party Report of Corporate/Labor Contributions
      JCOH: Individual # Judicial Candidate/Office Holder
      SPAC: Committee # Specific Purpose Committee
      GPAC: Committee # General Purpose Committee

    recipient--transactor_type:
      MPAC: Organization
      COH: Individual
      PTYCORP: Organization
      JCOH: Individual
      SPAC: Organization
      GPAC: Organization


  inherits: base
  table_name: Transaction
  column_details:
    - raw_name: recordType
      type: str
      description: Seemingly always RCPT.

    - raw_name: formTypeCd
      type: str
      description: Unclear. Options include MPAC, CORPAC, COH, JCOH, SPAC, GPAC, ..

    - raw_name: schedFormTypeCd
      type: str
      description: Unclear. Options include A1, A2, C1, C2, C3, AJ1

    - raw_name: reportInfoIdent
      type: str

    - raw_name: receivedDt
      type: str
      standard_name: date
      date_format: "%Y%m%d"

    - raw_name: infoOnlyFlag
      type: str

    - raw_name: filerIdent
      type: str
      standard_name: recipient_id

    - raw_name: filerTypeCd
      type: str
      standard_name: recipient--transactor_type

    - raw_name: filerName
      type: str
      standard_name: recipient--full_name

    - raw_name: contributionInfoId
      type: str

    - raw_name: contributionDt
      type: str
      standard_name: contribution_date
      date_format: "%Y%m%d"

    - raw_name: contributionAmount
      type: Float32
      standard_name: amount

    - raw_name: contributionDescr
      type: str
      standard_name: description

    - raw_name: itemizeFlag
      type: str

    - raw_name: travelFlag
      type: str

    - raw_name: contributorPersentTypeCd
      type: str
      standard_name: donor--transactor_type

    - raw_name: contributorNameOrganization
      type: str
      standard_name: donor--organization_name

    - raw_name: contributorNameLast
      type: str
      standard_name: donor--last_name

    - raw_name: contributorNameSuffixCd
      type: str
      standard_name: donor--name_suffix

    - raw_name: contributorNameFirst
      type: str
      standard_name: donor--first_name

    - raw_name: contributorNamePrefixCd
      type: str
      standard_name: donor--name_prefix

    - raw_name: contributorNameShort
      type: str
      standard_name: donor--name_preferred

    - raw_name: contributorStreetCity
      type: str
      standard_name: donor--address--city

    - raw_name: contributorStreetStateCd
      type: str
      standard_name: donor--address--state

    - raw_name: contributorStreetCountyCd
      type: str
      standard_name: donor--address--county

    - raw_name: contributorStreetCountryCd
      type: str
      standard_name: donor--address--country

    - raw_name: contributorStreetPostalCode
      type: str
      standard_name: donor--address--zipcode

    - raw_name: contributorStreetRegion
      type: str
      standard_name: donor--address--region

    - raw_name: contributorEmployer
      type: str
      standard_name: donor--employer--organization--full_name

    - raw_name: contributorOccupation
      type: str
      standard_name: donor--employer--role

    - raw_name: contributorJobTitle
      type: str
      standard_name: donor--employer--job_title

    - raw_name: contributorPacFein
      type: str
      standard_name: donor--ein

    - raw_name: contributorOosPacFlag
      type: str

    - raw_name: contributorLawFirmName
      type: str

    - raw_name: contributorSpouseLawFirmName
      type: str

    - raw_name: contributorParent1LawFirmName
      type: str

    - raw_name: contributorParent2LawFirmName
      type: str

  column_order:
    - recordType
    - formTypeCd
    - schedFormTypeCd
    - reportInfoIdent
    - receivedDt
    - infoOnlyFlag
    - filerIdent
    - filerTypeCd
    - filerName
    - contributionInfoId
    - contributionDt
    - contributionAmount
    - contributionDescr
    - itemizeFlag
    - travelFlag
    - contributorPersentTypeCd
    - contributorNameOrganization
    - contributorNameLast
    - contributorNameSuffixCd
    - contributorNameFirst
    - contributorNamePrefixCd
    - contributorNameShort
    - contributorStreetCity
    - contributorStreetStateCd
    - contributorStreetCountyCd
    - contributorStreetCountryCd
    - contributorStreetPostalCode
    - contributorStreetRegion
    - contributorEmployer
    - contributorOccupation
    - contributorJobTitle
    - contributorPacFein
    - contributorOosPacFlag
    - contributorLawFirmName
    - contributorSpouseLawFirmName
    - contributorParent1LawFirmName
    - contributorParent2LawFirmName

expenditures:
  inherits: contributions
  table_name: Transaction
  path_pattern: ^expend_\d{2}\.csv$
  duplicate_columns:
