      MCEC: Committee # Monthly Filing County Executive Committee

    donor--transactor_type:
      COH: Individual
      GPAC: Organization
      JCOH: Individual
      SPAC: Organization
      MPAC: Organization
      PTYCORP: Organization
      SCC: Organization
      ASIFSPAC: Organization
      CEC: Organization
      JSPC: Organization
      LEG: Organization
      SPK: Organization
