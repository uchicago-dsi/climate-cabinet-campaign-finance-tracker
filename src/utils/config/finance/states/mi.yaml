base:
  meta: True
  state_code: MI
  read_csv_params:
    encoding: mac_roman
    on_bad_lines: warn
    header: 0
  include_column_order: False
  state_code_columns:
    - reported_state
  year_filter_filepath_regex: ".*\\/(\\d{4})\\/[^\\/]+$"

legacy_download_contributions_or_receipts:
  inherits: base
  table_name: Transaction
  path_pattern: "^LegacyDownloads/(\\d{4})/(\\d{4})_mi_cfr_(contributions|receipts).*\\.csv$"
  
  enum_mapper:
    recipient--transactor_type:
      CAN: Organization
      IND: Organization
      GUB: Organization
      COU: Organization
      POL: Organization
      BAL: Organization
      DIS: Organization
      STA: Organization

    recipient--transactor_type_specific:
      CAN: Candidate Committee
      IND: Committee
      GUB: Candidate Committee
      COU: Party
      POL: Committee
      BAL: Committee
      DIS: Committee
      STA: Party

  duplicate_columns:
    recipient--transactor_type:
      - recipient--transactor_type_specific

  column_details:
    - raw_name: "doc_seq_no"
      type: Int32
      description: "Document sequence number"
    - raw_name: "page_no"
      type: Int32
      description: "Page number"
    - raw_name: "contribution_id"
      type: Int32
      #TODO
    - raw_name: "cont_detail_id"
      type: Int32
    - raw_name: "doc_stmnt_year"
      type: Int32
      standard_name: reported_election_year
      description: "Document statement year"
    - raw_name: "doc_type_desc"
      type: str
      description: "Document type description"
    - raw_name: "com_legal_name"
      type: str
      standard_name: recipient--full_name
      description: "Committee legal name"
    - raw_name: "common_name"
      type: str
      description: "Committee common name"
      standard_name: recipient--name_preferred
    - raw_name: "cfr_com_id"
      type: str
      standard_name: recipient_id
      description: "Committee ID"
    - raw_name: "com_type"
      type: str
      standard_name: recipient--transactor_type
      description: "Committee type"
    - raw_name: "can_first_name"
      type: str
      standard_name: recipient--candidate--member--first_name
      description: "Candidate first name"
    - raw_name: "can_last_name"
      type: str
      standard_name: recipient--candidate--member--last_name
      description: "Candidate last name"
    - raw_name: "contribtype"
      type: str
      standard_name: transaction_type
      description: "Type of contribution"
    - raw_name: "f_name"
      type: str
      standard_name: donor--first_name
      description: "Donor first name"
    - raw_name: "l_name_or_org"
      type: str
      standard_name: donor--full_name
    - raw_name: "address"
      type: str
      standard_name: donor--address--line_1

    - raw_name: "city"
      type: str
      standard_name: donor--address--city

    - raw_name: "state"
      type: str
      standard_name: donor--address--state

    - raw_name: "zip"
      type: str
      standard_name: donor--address--zipcode

    - raw_name: "occupation"
      type: str
      standard_name: donor--employer--role

    - raw_name: "employer"
      type: str
      standard_name: donor--employer--organization--full_name

    - raw_name: "received_date"
      type: str
      standard_name: date
      format: "%m/%d/%Y"

    - raw_name: "amount"
      type: str
      standard_name: amount

    - raw_name: "aggregate"
      type: Float32

    - raw_name: "extra_desc"
      type: str
      standard_name: description

    - raw_name: "RUNTIME"
      type: str

legacy_download_expenditures:
  inherits: legacy_download_contributions_or_receipts
  table_name: Transaction
  path_pattern: "^LegacyDownloads/(\\d{4})/(\\d{4})_mi_cfr_expenditures.*\\.csv$"

  overloaded_columns:
    "Unnamed: 28":
      pattern: ^(?P<generated_office>STATE SENATE|STATE REPRESENTATIVE)\s+(MI)?(?P<generated_district>\d{1,3})


  column_details:
